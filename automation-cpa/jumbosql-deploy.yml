---
# jumbosql-deploy.yml - copied into the CPA playbook directory (next to crunchy-postgres-ha.playbook.yml,
# group_vars/ and files/), so every relative path in CPA resolves exactly as on the Ansible VM.
#
# The two debug tasks are read by the JumboSQL console from the JSON log, by task name:
#   "System info"                                       -> the database servers shown on the cluster page
#   "vitabaks.autobase.deploy_finish : Connection info" -> connection details + SQL editor registration
# Keep those names exactly as written.

- name: JumboSQL - register database servers in the console
  hosts: patroni_cluster
  gather_facts: false
  tasks:
    - name: System info
      ansible.builtin.debug:
        msg:
          server_name: "{{ jumbo_hostname | default(inventory_hostname) }}"
          ip_address: "{{ ansible_host | default(inventory_hostname) }}"

- name: Crunchy Postgres HA (CPA 2.2.0)
  ansible.builtin.import_playbook: crunchy-postgres-ha.playbook.yml

# The SQL editor is registered against HAProxy's read-write port, which always routes to the current
# Patroni leader - so the editor keeps working after a switchover or failover.
- name: JumboSQL - connection info for the console and the SQL editor
  hosts: haproxy_cluster
  gather_facts: false
  tasks:
    - name: "vitabaks.autobase.deploy_finish : Connection info"
      run_once: true
      ansible.builtin.debug:
        msg:
          address: "{{ ansible_host | default(inventory_hostname) }}"
          port:
            primary: "{{ haproxy_client_pgport_rw | default(5432) }}"
            replica: "{{ haproxy_client_pgport_ro | default(5433) }}"
            pgbouncer: "{{ pgbouncer_client_pgport | default(6432) }}"
          superuser: postgres
          password: >-
            {{ '********' if (jumbosql_mask_password | default(false) | bool)
               else (postgresql_super_pgpassword | default('********')) }}
