  Request.BackupJob:
    type: object
    required: [action]
    properties:
      action:
        type: string
        description: "backup | check | stanza-create | config | schedule | restore | repo-add | repo-remove"
      stanza:
        type: string
      repo:
        type: string
        description: "backup / restore: the repository number (empty: pgBackRest's choice)"
      index:
        type: integer
        description: "repo-add / repo-remove: the repository number"
      repo_def:
        type: object
        description: "repo-add: {type: posix|cifs|s3|azure|gcs|sftp, path, bucket, endpoint, region, key, secret, uri_style, port, verify_tls, account, container, host, user, private_key, retention_full, retention_diff, cipher_pass}"
      type:
        type: string
        description: "backup: full | diff | incr; restore: latest | time | set"
      target_time:
        type: string
        description: "restore to this time (PITR), e.g. 2026-10-14 10:30:00+05:30"
      set:
        type: string
        description: "restore this backup set (label)"
      restore_host:
        type: string
        description: "the node to restore as the primary (empty: the current primary)"
      pre_backup:
        type: boolean
        description: "restore: take an incremental backup first"
      post_backup:
        type: boolean
        x-nullable: true
        description: "restore: take a full backup after it (default true)"
      confirm:
        type: string
        description: "restore: the cluster name, typed by the user"
      config:
        type: string
        description: "config: the new pgbackrest.conf"
      file:
        type: string
        description: "config: the file to write - the main pgbackrest.conf (default) or a conf.d/*.conf file, by name"
      config_kind:
        type: string
        description: "config: write it on the database nodes (db) or on the repository servers (repo); empty = all"
      keep_local:
        type: boolean
        x-nullable: true
        description: "config: each node keeps its own pg*-path / port / socket / host (default true)"
      verify:
        type: boolean
        x-nullable: true
        description: "config: run pgbackrest check after writing; on failure every node gets its old config back (default true)"
      entries:
        type: array
        description: "schedule: {type, minute, hour, dom, month, dow}"
        items:
          type: object
      remove:
        type: boolean
        description: "schedule: remove the schedule"
      ssh_user:
        type: string
      ssh_password:
        type: string
      ssh_key:
        type: string
      ssh_port:
        type: integer

