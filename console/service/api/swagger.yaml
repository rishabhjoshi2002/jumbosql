        - plain/text
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Operation id"
      responses:
        '200':
          description: OK
          schema:
            type: string
          headers:
            content-type:
              type: string
            x-log-completed:
              type: boolean
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

definitions:
  Response.Version:
    title: Version response
    type: object
    properties:
      version:
        type: string
        example: v1.0.0

  Request.PatroniSwitchover:
    type: object
    properties:
      candidate_server_id:
        type: integer
        description: Server that becomes the new leader. Empty = let Patroni pick a healthy replica.

  Response.PatroniAction:
    type: object
    properties:
      action:
        type: string
      member:
        type: string
      message:
        type: string

  Request.Login:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
      password:
        type: string

  Response.Login:
    type: object
    properties:
      token:
        type: string
      expires_at:
        type: string
        format: date-time
      user:
        $ref: "#/definitions/User"

  User:
    type: object
    properties:
      id:
        type: integer
      username:
        type: string
      display_name:
        type: string
      role:
        type: string
        description: "Legacy: the user's group (admin, operator, viewer); same as attributes.group"
      attributes:
        type: object
        description: "ABAC attributes, e.g. {\"group\": \"operator\", \"team\": \"payments\"}"
        additionalProperties:
          type: string
      permissions:
        type: object
        description: "Only in /auth/me: {global: [permissions], clusters: {<id>: [permissions]}}"
      preferences:
        type: object
        description: "Only in /auth/me: the user's home page choices"
      auth_provider:
        type: string
      created_at:
        type: string
        format: date-time
      last_login_at:
        type: string
        format: date-time
        x-nullable: true

  Request.UserCreate:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
      display_name:
        type: string
      password:
        type: string
      role:
        type: string
        description: "Legacy: sets the group attribute"
      attributes:
        type: object
        additionalProperties:
          type: string

  Request.UserUpdate:
    type: object
    properties:
      display_name:
        type: string
      password:
        type: string
      role:
        type: string
        description: "Legacy: sets the group attribute"
      attributes:
        type: object
        description: Replaces all attributes when given
        additionalProperties:
          type: string
      home:
        type: object
        description: "pg_mantra: the user's home page, set by an admin (cards in order, start page)"
        properties:
          cards:
            type: array
            items:
              type: string
          start_page:
            type: string

  Request.Discover:
    type: object
    required: [inventory, username]
    properties:
      inventory:
        type: string
        description: "one server per line (host, host:port or host port), or an Ansible inventory (INI or YAML)"
      username:
        type: string
      password:
        type: string
        description: "used for this run only, never stored"
      database:
        type: string
        description: "database to log in to (default postgres)"
      sslmode:
        type: string
      name:
        type: string
        description: "a name to save the result under"
      save:
        type: boolean
      pg_port:
        type: integer
        description: "PostgreSQL port when the inventory does not say (default 5432)"
      ssh_user:
        type: string
        description: "optional: SSH login for read-only commands on the machines"
      ssh_port:
        type: integer
      ssh_password:
        type: string
        description: "used for this run only, never stored"
      ssh_key:
        type: string
        description: "private key; used for this run only, never stored"
      prometheus_url:
        type: string
        description: "optional: Prometheus to read usage history from (default: one found on the machines)"
      days:
        type: integer
        description: "days of history to read (default 30)"
      horizon:
        type: integer
        description: "days ahead to size for (default 180)"
      follow:
        type: boolean
        x-nullable: true
        description: "follow connections to machines that are not in the inventory (default true)"
      host_auth:
        type: array
        description: "SSH logins for single machines (used for this run only, never stored)"
        items:
          type: object
          properties:
            host:
              type: string
            user:
              type: string
            port:
              type: integer
            password:
              type: string
            key:
              type: string

  Request.Upgrade:
    type: object
    required: [component, action]
    properties:
      component:
        type: string
      action:
        type: string
        description: "plan | run | rollback"
      parent_id:
        type: integer
        description: "run: the plan it follows; rollback: the run to undo"
      target:
        type: string
        description: "version to upgrade to (empty: the newest in the repositories)"
      allow_unsaved:
        type: boolean
      restore_config:
        type: boolean
      binary_url:
        type: string
      hosts:
        type: array
        items:
          type: string
      ssh_user:
        type: string
      ssh_password:
        type: string
        description: "used for this run only, never stored"
      ssh_key:
        type: string
        description: "used for this run only, never stored"
      ssh_port:
        type: integer
      repo_url:
        type: string
        description: "your package repository (yum baseurl, or a full 'deb ...' line), added on the nodes for the run only"
      repo_only:
        type: boolean
        description: "take the packages only from that repository (dnf / yum)"
      repo_gpgcheck:
        type: boolean
      repo_gpgkey:
        type: string

  Request.Playbook:
    type: object
    required: [name]
    properties:
      name:
        type: string
      description:
        type: string
      playbook:
        type: string
        description: "the upgrade playbook (YAML); or playbook_path inside the archive"
      playbook_path:
        type: string
      rollback:
        type: string
        description: "the rollback playbook (YAML); or rollback_path inside the archive (empty: no rollback)"
      rollback_path:
        type: string
      requirements:
        type: string
        description: "requirements.yml: collections / roles installed before each run"
      variables:
        type: array
        description: "inputs asked at each run: {name, label, type (text|password|number|boolean|select|textarea), required, default, options, help}"
        items:
          type: object
      groups:
        type: array
        description: "inventory groups the playbook uses: {group, from} (from: a component found by Discover, e.g. postgres)"
        items:
          type: object
      files_base64:
        type: string
        description: ".tar.gz / .tgz / .zip with roles, files, templates, group_vars ... (base64)"
      files_name:
        type: string
      files_keep:
        type: boolean
        description: "change: keep the stored archive"
      git_url:
        type: string
        description: "the files come from this GitHub repository (https://github.com/owner/repo, owner/repo, or a GitHub Enterprise address)"
      git_ref:
        type: string
        description: "branch, tag or commit (empty: the default branch)"
      git_token:
        type: string
        description: "access token for a private repository; used for this pull only, never saved"
      git_pull:
        type: boolean
        description: "change: pull the repository again (latest of the branch)"

  Request.PlaybookRun:
    type: object
    required: [action]
    properties:
      action:
        type: string
        description: "plan (dry run: --check --diff) | run | rollback"
      parent_id:
        type: integer
        description: "run: the dry run it follows; rollback: the run to undo"
      discovery_id:
        type: integer
        description: "the machines: a saved Discover result ..."
      cluster_id:
