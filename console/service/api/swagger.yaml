---
swagger: '2.0'
info:
  title: autobase console
  description: API for autobase console
  version: 2.11.0
host: localhost:8080
schemes:
  - http
produces:
  - application/json
consumes:
  - application/json
basePath: "/api/v1"

paths:
  /version:
    get:
      summary: Get version of API service
      tags:
        - system
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Version"

  /external/deployments:
    get:
      summary: Get full info about available external deployments
      tags:
        - dictionary
      parameters:
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.DeploymentsInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /database/extensions:
    get:
      summary: "Info about available database extensions"
      tags:
        - dictionary
      parameters:
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
        - name: extension_type
          in: query
          required: false
          type: string
          default: "all"
          enum:
            - "all"
            - "contrib"
            - "third_party"
        - name: postgres_version
          in: query
          required: false
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.DatabaseExtensions"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
  /environments:
    get:
      summary: "Get environments list"
      tags:
        - environment
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
        - name: offset
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.EnvironmentsList"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    post:
      summary: "Create environment"
      tags:
        - environment
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.Environment'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Environment"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /environments/{id}:
    delete:
      summary: "Delete environment"
      tags:
        - environment
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /postgres_versions:
    get:
      summary: "Get supported postgres versions"
      tags:
        - dictionary
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PostgresVersions"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /settings:
    post:
      summary: "Create new setting"
      tags:
        - setting
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.CreateSetting'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Setting"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    get:
      summary: "Get settings"
      tags:
        - setting
      parameters:
        - name: name
          in: query
          required: false
          type: string
          description: "Filter by name"
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Settings"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /settings/{name}:
    patch:
      summary: "Changed setting"
      tags:
        - setting
      parameters:
        - name: name
          in: path
          type: string
          required: true
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.ChangeSetting'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Setting"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters:
    post:
      summary: "Create new cluster"
      tags:
        - cluster
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.ClusterCreate'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ClusterCreate"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    get:
      summary: "Get info about clusters"
      tags:
        - cluster
      parameters:
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
        - name: project_id
          in: query
          required: true
          type: integer
        - name: name
          in: query
          required: false
          type: string
          description: "Filter by name"
        - name: status
          type: string
          in: query
          required: false
          description: "Filter by status"
        - name: location
          type: string
          in: query
          required: false
          description: "Filter by location"
        - name: environment
          type: string
          in: query
          required: false
          description: "Filter by environment"
        - name: server_count
          type: integer
          in: query
          required: false
          description: "Filter by server_count"
        - name: postgres_version
          type: integer
          in: query
          required: false
          description: "Filter by postgres_version"
        - name: created_at_from
          required: false
          type: string
          format: date-time
          in: query
          description: "Created at after this date"
        - name: created_at_to
          required: false
          type: string
          format: date-time
          in: query
          description: "Created at till this date"
        - name: sort_by
          in: query
          required: false
          type: string
          description: "Sort by fields. Example: sort_by=id,-name,created_at,updated_at\n
          Supported values:\n
           - id\n
           - name\n
           - created_at\n
           - updated_at\n
           - environment\n
           - project\n
           - status\n
           - location\n
           - server_count\n
           - postgres_version\n"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ClustersInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/default_name:
    get:
      summary: "Get cluster default name"
      tags:
        - cluster
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ClusterDefaultName"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}:
    get:
      summary: "Get cluster info"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/ClusterInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    delete:
      summary: "Delete cluster (from the console database)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /servers/{id}:
    delete:
      summary: "Delete server (from the console database)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
          headers:
            x-cluster-id:
              type: integer
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/refresh:
    post:
      summary: "Refresh cluster info (from Patroni API)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/ClusterInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/switchover:
    post:
      summary: "JumboSQL: Patroni switchover (leader moves to the candidate, or to the healthiest replica)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: false
          schema:
            $ref: "#/definitions/Request.PatroniSwitchover"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniAction"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /servers/{id}/restart:
    post:
      summary: "JumboSQL: restart PostgreSQL on this node through Patroni"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniAction"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /servers/{id}/reinitialize:
    post:
      summary: "JumboSQL: reinitialize this replica from the leader through Patroni"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniAction"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /auth/login:
    post:
      summary: "JumboSQL: sign in with username and password"
      tags:
        - auth
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.Login"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Login"
        '401':
          description: Invalid username or password
          schema:
            $ref: "#/definitions/Response.Error"

  /auth/logout:
    post:
      summary: "JumboSQL: end the current session"
      tags:
        - auth
      responses:
        '204':
          description: OK

  /auth/me:
    get:
      summary: "JumboSQL: the signed-in user"
      tags:
        - auth
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/User"

  /auth/password:
    post:
      summary: "JumboSQL: change your own password"
      tags:
        - auth
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.PasswordChange"
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /users:
    get:
      summary: "JumboSQL: list console users (admin)"
      tags:
        - user
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/User"
    post:
      summary: "JumboSQL: add a local user (admin)"
      tags:
        - user
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.UserCreate"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/User"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /users/{id}:
    patch:
      summary: "JumboSQL: change a user's role, display name or password (admin)"
      tags:
        - user
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.UserUpdate"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/User"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    delete:
      summary: "JumboSQL: remove a user (admin)"
      tags:
        - user
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/patroni:
    post:
      summary: "JumboSQL: run a patronictl-equivalent command through the Patroni REST API"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.PatroniCommand"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniCommand"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/sql:
    post:
      summary: "JumboSQL: run a SQL script on the cluster (through HAProxy's read-write port) and return every result set"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.SqlRun"
      responses:
        '200':
          description: OK (SQL errors are reported in the payload's error field)
          schema:
            $ref: "#/definitions/Response.SqlRun"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/sql/cancel:
    post:
      summary: "JumboSQL: cancel a running SQL editor script"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.SqlCancel"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.SqlCancel"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /policies:
    get:
      summary: "JumboSQL: list access policies"
      tags: [access]
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Policy"
    post:
      summary: "JumboSQL: create an access policy"
      tags: [access]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Policy"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Policy"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /policies/{id}:
    patch:
      summary: "JumboSQL: replace an access policy"
      tags: [access]
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Policy"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Policy"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    delete:
      summary: "JumboSQL: delete an access policy"
      tags: [access]
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: Deleted
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /policies/permissions:
    get:
      summary: "JumboSQL: the permissions policies can grant"
      tags: [access]
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/PermissionInfo"

  /policies/simulate:
    post:
      summary: "JumboSQL: what a user may do (optionally on one cluster and database), and which policies apply"
      tags: [access]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.PolicySimulate"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PolicySimulate"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /audit:
    get:
      summary: "JumboSQL: audit log"
      tags: [access]
      parameters:
        - {name: username, in: query, type: string}
        - {name: action, in: query, type: string, description: "action prefix, e.g. sql. or patroni."}
        - {name: outcome, in: query, type: string, enum: [ok, denied, error]}
        - {name: cluster_id, in: query, type: integer}
        - {name: from, in: query, type: string, format: date-time}
        - {name: to, in: query, type: string, format: date-time}
        - {name: q, in: query, type: string, description: "text search in path, action and details"}
        - {name: limit, in: query, type: integer}
        - {name: offset, in: query, type: integer}
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Audit"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/sql/access:
    get:
      summary: "JumboSQL: what the signed-in user may do in the SQL editor on this cluster"
      tags: [cluster]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - {name: database, in: query, type: string}
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/logs:
    get:
      summary: "JumboSQL: PostgreSQL log files of a cluster node"
      tags: [cluster]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - {name: server_id, in: query, required: true, type: integer}
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.LogFiles"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/logs/{file}:
    get:
      summary: "JumboSQL: read (the end of) a PostgreSQL log file of a cluster node"
      tags: [cluster]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - {name: file, in: path, required: true, type: string}
        - {name: server_id, in: query, required: true, type: integer}
        - {name: tail_kb, in: query, type: integer, description: "how much of the end of the file (default 256, max 8192)"}
        - {name: since, in: query, type: integer, description: "read from this byte offset (live tail); overrides tail_kb"}
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.LogChunk"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /projects:
    post:
      summary: "Create new project"
      tags:
        - project
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.ProjectCreate'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Project"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    get:
      summary: "Get projects list"
      tags:
        - project
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
        - name: offset
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ProjectsList"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /projects/{id}:
    patch:
      summary: "Change project"
      tags:
        - project
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.ProjectPatch'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Project"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    delete:
      summary: "Delete project"
      tags:
        - project
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /secrets:
    post:
      summary: "Create new secret"
      tags:
        - secret
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.SecretCreate'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.SecretInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    get:
      summary: "Get secrets list"
      tags:
        - secret
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
        - name: offset
          in: query
          required: false
          type: integer
        - name: project_id
          in: query
          required: true
          type: integer
        - name: name
          in: query
          required: false
          type: string
          description: "Filter by name"
        - name: type
          in: query
          required: false
          type: string
          description: "Filter by type"
        - name: sort_by
          in: query
          required: false
          type: string
          description: "Sort by fields. Example: sort_by=id,name,-type,created_at,updated_at"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.SecretInfoList"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /secrets/{id}:
    patch:
      summary: "Change secret"
      tags:
        - secret
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.SecretPatch'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.SecretInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    delete:
      summary: "Delete secret"
      tags:
        - secret
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /operations:
    get:
      summary: "Get operations list for current project"
      tags:
        - operation
      parameters:
        - name: project_id
          in: query
          required: true
          type: integer
          description: "Required parameter for filter"
        - name: start_date
          required: true
          type: string
          format: date-time
          in: query
          description: "Operations started after this date"
        - name: end_date
          required: true
          type: string
          format: date-time
          in: query
          description: "Operations started till this date"
        - name: cluster_name
          in: query
          required: false
          type: string
          description: "Filter by cluster_name"
        - name: type
          in: query
          required: false
          type: string
          description: "Filter by type"
        - name: status
          in: query
          required: false
          type: string
          description: "Filter by status"
        - name: environment
          in: query
          required: false
          type: string
          description: "Filter by environment"
        - name: sort_by
          in: query
          required: false
          type: string
          description: "Sort by fields. Example: sort_by=cluster_name,type,status,id,started,finished\n
          Supported values:\n
           - id\n
           - cluster_name\n
           - type\n
           - status\n
           - started\n
           - finished\n
           - cluster\n
           - environment\n"
        - name: limit
          in: query
          required: false
          type: integer
        - name: offset
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.OperationsList"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /operations/{id}/log:
    get:
      summary: "Get operation log by operation_id"
      tags:
        - operation
      consumes:
        - plain/text
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Operation id"
      responses:
        '200':
          description: OK
          schema:
            type: string
          headers:
            content-type:
              type: string
            x-log-completed:
              type: boolean
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

definitions:
  Response.Version:
    title: Version response
    type: object
    properties:
      version:
        type: string
        example: v1.0.0

  Request.PatroniSwitchover:
    type: object
    properties:
      candidate_server_id:
        type: integer
        description: Server that becomes the new leader. Empty = let Patroni pick a healthy replica.

  Response.PatroniAction:
    type: object
    properties:
      action:
        type: string
      member:
        type: string
      message:
        type: string

  Request.Login:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
      password:
        type: string

  Response.Login:
    type: object
    properties:
      token:
        type: string
      expires_at:
        type: string
        format: date-time
      user:
        $ref: "#/definitions/User"

  User:
    type: object
    properties:
      id:
        type: integer
      username:
        type: string
      display_name:
        type: string
      role:
        type: string
        description: "Legacy: the user's group (admin, operator, viewer); same as attributes.group"
      attributes:
        type: object
        description: "ABAC attributes, e.g. {\"group\": \"operator\", \"team\": \"payments\"}"
        additionalProperties:
          type: string
      permissions:
        type: object
        description: "Only in /auth/me: {global: [permissions], clusters: {<id>: [permissions]}}"
      auth_provider:
        type: string
      created_at:
        type: string
        format: date-time
      last_login_at:
        type: string
        format: date-time
        x-nullable: true

  Request.UserCreate:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
      display_name:
        type: string
      password:
        type: string
      role:
        type: string
        description: "Legacy: sets the group attribute"
      attributes:
        type: object
        additionalProperties:
          type: string

  Request.UserUpdate:
    type: object
    properties:
      display_name:
        type: string
      password:
        type: string
      role:
        type: string
        description: "Legacy: sets the group attribute"
      attributes:
        type: object
        description: Replaces all attributes when given
        additionalProperties:
          type: string

  Request.PasswordChange:
    type: object
    required: [current_password, new_password]
    properties:
      current_password:
        type: string
      new_password:
        type: string

  Request.PatroniCommand:
    type: object
    required: [command]
    properties:
      command:
        type: string
        enum: [list, history, show-config, edit-config, pause, resume, switchover, failover, restart, reinit, reload]
      member:
        type: string
        description: Patroni member name (restart, reinit, reload; empty = all members for restart/reload)
      candidate:
        type: string
        description: Member that becomes the leader (switchover optional, failover required)
      config:
        type: object
        description: Partial DCS configuration to merge (edit-config)

  Response.PatroniCommand:
    type: object
    properties:
      command:
        type: string
        description: The equivalent patronictl command line
      message:
        type: string
      data:
        type: object

  Request.SqlRun:
    type: object
    required: [sql]
    properties:
      sql:
        type: string
        description: One or more SQL statements
      database:
        type: string
        description: Database to connect to (default postgres)
      max_rows:
        type: integer
        description: Rows kept per result set (default 1000, max 100000)
      timeout_seconds:
        type: integer
        description: Stop the script after this many seconds (default 300)
      run_id:
        type: string
        description: Client-chosen id, used to cancel the run

  Response.SqlRun:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: "#/definitions/SqlResultSet"
      notices:
        type: array
        items:
          type: string
      error:
        $ref: "#/definitions/SqlError"
      cancelled:
        type: boolean
      duration_ms:
        type: number
      server:
        type: string
        description: Address of the PostgreSQL node that ran the script (the leader)
      database:
        type: string

  SqlResultSet:
    type: object
    properties:
      statement:
        type: integer
      columns:
        type: array
        items:
          $ref: "#/definitions/SqlColumn"
      rows:
        type: array
        items:
          type: array
          items:
            type: string
            x-nullable: true
      row_count:
        type: integer
      truncated:
        type: boolean
      command_tag:
        type: string
      duration_ms:
        type: number

  SqlColumn:
    type: object
    properties:
      name:
        type: string
      type:
        type: string
      type_oid:
        type: integer

  SqlError:
    type: object
    properties:
      message:
        type: string
      severity:
        type: string
      sqlstate:
        type: string
      detail:
        type: string
      hint:
        type: string
      position:
        type: integer
      where:
        type: string
      statement:
        type: integer

  Request.SqlCancel:
    type: object
    required: [run_id]
    properties:
      run_id:
        type: string

  Response.SqlCancel:
    type: object
    properties:
      cancelled:
        type: boolean

  Policy:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
      description: {type: string}
      effect: {type: string, enum: [allow, deny]}
      enabled: {type: boolean}
      builtin: {type: boolean}
      subjects: {type: object}
      permissions:
        type: array
        items: {type: string}
      resources: {type: object}
      data: {type: object}
      conditions: {type: object}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time, x-nullable: true}
      updated_by: {type: string}

  PermissionInfo:
    type: object
    properties:
      name: {type: string}
      description: {type: string}
      cluster_scoped: {type: boolean}

  Request.PolicySimulate:
    type: object
    required: [username]
    properties:
      username: {type: string}
      cluster_id: {type: integer}
      database: {type: string}
      client_ip: {type: string}
      at: {type: string, format: date-time}
      policy:
        $ref: "#/definitions/Policy"

  Response.PolicySimulate:
    type: object
    properties:
      username: {type: string}
      attributes:
        type: object
        additionalProperties: {type: string}
      permissions: {type: object}
      decisions: {type: object}
      sql: {type: object}
      policies:
        type: array
        items: {type: object}

  Response.Audit:
    type: object
    properties:
      data:
        type: array
        items: {type: object}
      total: {type: integer}

  Response.LogFiles:
    type: object
    properties:
      server: {type: string}
      log_directory: {type: string}
      current: {type: string}
      files:
        type: array
        items:
          type: object
          properties:
            name: {type: string}
            size: {type: integer}
            modified: {type: string, format: date-time}

  Response.LogChunk:
    type: object
    properties:
      file: {type: string}
      size: {type: integer}
      offset: {type: integer, description: "byte offset where text starts"}
      next: {type: integer, description: "pass as since= to continue (live tail)"}
      text: {type: string}
      truncated: {type: boolean, description: "the start of the file was skipped"}

  Response.Error:
    title: Error object
    type: object
    properties:
      code:
        type: integer
      title:
        type: string
      description:
        type: string

  Meta.Pagination:
    title: Pagination info for list requests
    type: object
    properties:
      offset:
        type: integer
        x-nullable: true
      limit:
        type: integer
        x-nullable: true
      count:
        type: integer
        x-nullable: true

  Response.DeploymentsInfo:
    title: Deployments info
    type: object
    properties:
      data:
        type: array
        items:
          $ref: "#/definitions/Response.DeploymentInfo"
      meta:
        $ref: '#/definitions/Meta.Pagination'

  Response.DeploymentInfo:
    description: Deployment info
    type: object
    properties:
      code:
        type: string
        example: "aws"
      description:
        type: string
        example: "Amazon web services"
      avatar_url:
        type: string
      cloud_regions:
        description: "List of available regions for current deployment"
        type: array
        items:
          $ref: '#/definitions/DeploymentInfo.CloudRegion'
      instance_types:
        description: "Lists of available instance types"
