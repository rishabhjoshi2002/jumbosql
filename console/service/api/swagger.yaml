---
swagger: '2.0'
info:
  title: pg_MANTRA console
  description: API for the pg_MANTRA console (based on the Autobase console, MIT)
  version: 2.11.0
host: localhost:8080
schemes:
  - http
produces:
  - application/json
consumes:
  - application/json
basePath: "/api/v1"

paths:
  /version:
    get:
      summary: Get version of API service
      tags:
        - system
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Version"

  /external/deployments:
    get:
      summary: Get full info about available external deployments
      tags:
        - dictionary
      parameters:
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.DeploymentsInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /database/extensions:
    get:
      summary: "Info about available database extensions"
      tags:
        - dictionary
      parameters:
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
        - name: extension_type
          in: query
          required: false
          type: string
          default: "all"
          enum:
            - "all"
            - "contrib"
            - "third_party"
        - name: postgres_version
          in: query
          required: false
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.DatabaseExtensions"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
  /environments:
    get:
      summary: "Get environments list"
      tags:
        - environment
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
        - name: offset
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.EnvironmentsList"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    post:
      summary: "Create environment"
      tags:
        - environment
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.Environment'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Environment"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /environments/{id}:
    delete:
      summary: "Delete environment"
      tags:
        - environment
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /postgres_versions:
    get:
      summary: "Get supported postgres versions"
      tags:
        - dictionary
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PostgresVersions"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /settings:
    post:
      summary: "Create new setting"
      tags:
        - setting
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.CreateSetting'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Setting"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    get:
      summary: "Get settings"
      tags:
        - setting
      parameters:
        - name: name
          in: query
          required: false
          type: string
          description: "Filter by name"
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Settings"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /settings/{name}:
    patch:
      summary: "Changed setting"
      tags:
        - setting
      parameters:
        - name: name
          in: path
          type: string
          required: true
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.ChangeSetting'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Setting"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters:
    post:
      summary: "Create new cluster"
      tags:
        - cluster
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Request.ClusterCreate'
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ClusterCreate"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    get:
      summary: "Get info about clusters"
      tags:
        - cluster
      parameters:
        - name: offset
          in: query
          required: false
          type: integer
        - name: limit
          in: query
          required: false
          type: integer
        - name: project_id
          in: query
          required: true
          type: integer
        - name: name
          in: query
          required: false
          type: string
          description: "Filter by name"
        - name: status
          type: string
          in: query
          required: false
          description: "Filter by status"
        - name: location
          type: string
          in: query
          required: false
          description: "Filter by location"
        - name: environment
          type: string
          in: query
          required: false
          description: "Filter by environment"
        - name: server_count
          type: integer
          in: query
          required: false
          description: "Filter by server_count"
        - name: postgres_version
          type: integer
          in: query
          required: false
          description: "Filter by postgres_version"
        - name: created_at_from
          required: false
          type: string
          format: date-time
          in: query
          description: "Created at after this date"
        - name: created_at_to
          required: false
          type: string
          format: date-time
          in: query
          description: "Created at till this date"
        - name: sort_by
          in: query
          required: false
          type: string
          description: "Sort by fields. Example: sort_by=id,-name,created_at,updated_at\n
          Supported values:\n
           - id\n
           - name\n
           - created_at\n
           - updated_at\n
           - environment\n
           - project\n
           - status\n
           - location\n
           - server_count\n
           - postgres_version\n"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ClustersInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/default_name:
    get:
      summary: "Get cluster default name"
      tags:
        - cluster
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.ClusterDefaultName"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}:
    get:
      summary: "Get cluster info"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/ClusterInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

    delete:
      summary: "Delete cluster (from the console database)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /servers/{id}:
    delete:
      summary: "Delete server (from the console database)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
          headers:
            x-cluster-id:
              type: integer
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/refresh:
    post:
      summary: "Refresh cluster info (from Patroni API)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/ClusterInfo"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/switchover:
    post:
      summary: "pg_mantra: Patroni switchover (leader moves to the candidate, or to the healthiest replica)"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: false
          schema:
            $ref: "#/definitions/Request.PatroniSwitchover"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniAction"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /servers/{id}/restart:
    post:
      summary: "pg_mantra: restart PostgreSQL on this node through Patroni"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniAction"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /servers/{id}/reinitialize:
    post:
      summary: "pg_mantra: reinitialize this replica from the leader through Patroni"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniAction"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /auth/login:
    post:
      summary: "pg_mantra: sign in with username and password"
      tags:
        - auth
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.Login"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Login"
        '401':
          description: Invalid username or password
          schema:
            $ref: "#/definitions/Response.Error"

  /auth/logout:
    post:
      summary: "pg_mantra: end the current session"
      tags:
        - auth
      responses:
        '204':
          description: OK

  /auth/me:
    get:
      summary: "pg_mantra: the signed-in user"
      tags:
        - auth
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/User"

  /auth/me/preferences:
    put:
      summary: "pg_mantra: save the signed-in user's home page choices"
      tags:
        - auth
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /auth/password:
    post:
      summary: "pg_mantra: change your own password"
      tags:
        - auth
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.PasswordChange"
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /users:
    get:
      summary: "pg_mantra: list console users (admin)"
      tags:
        - user
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/User"
    post:
      summary: "pg_mantra: add a local user (admin)"
      tags:
        - user
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.UserCreate"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/User"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /users/{id}:
    patch:
      summary: "pg_mantra: change a user's role, display name or password (admin)"
      tags:
        - user
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.UserUpdate"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/User"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    delete:
      summary: "pg_mantra: remove a user (admin)"
      tags:
        - user
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: OK
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/patroni:
    post:
      summary: "pg_mantra: run a patronictl-equivalent command through the Patroni REST API"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.PatroniCommand"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PatroniCommand"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/sql:
    post:
      summary: "pg_mantra: run a SQL script on the cluster (through HAProxy's read-write port) and return every result set"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.SqlRun"
      responses:
        '200':
          description: OK (SQL errors are reported in the payload's error field)
          schema:
            $ref: "#/definitions/Response.SqlRun"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/sql/cancel:
    post:
      summary: "pg_mantra: cancel a running SQL editor script"
      tags:
        - cluster
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.SqlCancel"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.SqlCancel"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /policies:
    get:
      summary: "pg_mantra: list access policies"
      tags: [access]
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Policy"
    post:
      summary: "pg_mantra: create an access policy"
      tags: [access]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Policy"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Policy"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /policies/{id}:
    patch:
      summary: "pg_mantra: replace an access policy"
      tags: [access]
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Policy"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Policy"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    delete:
      summary: "pg_mantra: delete an access policy"
      tags: [access]
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        '204':
          description: Deleted
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /policies/permissions:
    get:
      summary: "pg_mantra: the permissions policies can grant"
      tags: [access]
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/PermissionInfo"

  /policies/simulate:
    post:
      summary: "pg_mantra: what a user may do (optionally on one cluster and database), and which policies apply"
      tags: [access]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.PolicySimulate"
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.PolicySimulate"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /audit:
    get:
      summary: "pg_mantra: audit log"
      tags: [access]
      parameters:
        - {name: username, in: query, type: string}
        - {name: action, in: query, type: string, description: "action prefix, e.g. sql. or patroni."}
        - {name: outcome, in: query, type: string, enum: [ok, denied, error]}
        - {name: cluster_id, in: query, type: integer}
        - {name: from, in: query, type: string, format: date-time}
        - {name: to, in: query, type: string, format: date-time}
        - {name: q, in: query, type: string, description: "text search in path, action and details"}
        - {name: limit, in: query, type: integer}
        - {name: offset, in: query, type: integer}
      responses:
        '200':
          description: OK
          schema:
            $ref: "#/definitions/Response.Audit"
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/sql/access:
    get:
      summary: "pg_mantra: what the signed-in user may do in the SQL editor on this cluster"
      tags: [cluster]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - {name: database, in: query, type: string}
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /insights/summary:
    get:
      summary: "pg_mantra: health, warnings and outlook of every cluster of a project (the clusters the user may see)"
      tags: [cluster]
      parameters:
        - {name: project_id, in: query, required: true, type: integer}
        - {name: refresh, in: query, type: boolean, description: "rebuild every summary now instead of using the hourly ones"}
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /discover:
    post:
      summary: "pg_mantra: look at any PostgreSQL servers the console can reach and work out their architecture (read-only)"
      tags: [discover]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.Discover"
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /discover/query:
    post:
      summary: "pg_mantra: run one read-only query (SELECT / WITH / SHOW / EXPLAIN) on a server found by Discover"
      tags: [discover]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.DiscoverQuery"
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /upgrade/components:
    get:
      summary: "pg_mantra: components that can be upgraded"
      tags: [upgrade]
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              type: object

  /clusters/{id}/upgrades:
    get:
      summary: "pg_mantra: a cluster's upgrades (plans, runs, rollbacks), newest first"
      tags: [upgrade]
      parameters:
        - {name: id, in: path, required: true, type: integer}
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    post:
      summary: "pg_mantra: start a plan (dry run), a run (after a plan) or a rollback (after a run)"
      tags: [upgrade]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.Upgrade"
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /clusters/{id}/upgrades/{uid}:
    get:
      summary: "pg_mantra: one upgrade with what each node reported"
      tags: [upgrade]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - {name: uid, in: path, required: true, type: integer}
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /discoveries/{id}/upgrades:
    get:
      summary: "pg_mantra: upgrades of a setup found by Discover, newest first"
      tags: [upgrade]
      parameters:
        - {name: id, in: path, required: true, type: integer}
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    post:
      summary: "pg_mantra: start a dry run, an upgrade or a rollback on a setup found by Discover"
      tags: [upgrade]
      parameters:
        - {name: id, in: path, required: true, type: integer}
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.Upgrade"
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /custom-playbooks:
    get:
      summary: "pg_mantra: your upgrade playbooks"
      tags: [playbook]
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"
    post:
      summary: "pg_mantra: add an upgrade playbook"
      tags: [playbook]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Request.Playbook"
      responses:
        '200':
          description: OK
          schema:
            type: object
        '400':
          description: Error
          schema:
            $ref: "#/definitions/Response.Error"

  /custom-playbooks/{id}:
    get:
      summary: "pg_mantra: one upgrade playbook"
      tags: [playbook]
      parameters:
        - {name: id, in: path, required: true, type: integer}
      responses:
        '200':
