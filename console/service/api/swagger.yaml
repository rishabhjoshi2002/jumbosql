          description: "Required parameter for filter"
        - name: start_date
          required: true
          type: string
          format: date-time
          in: query
          description: "Operations started after this date"
        - name: end_date
          required: true
          type: string
          format: date-time
          in: query
          description: "Operations started till this date"
        - name: cluster_name
          in: query
          required: false
          type: string
          description: "Filter by cluster_name"
        - name: type
          in: query
          required: false
          type: string
          description: "Filter by type"
        - name: status
          in: query
          required: false
          type: string
          description: "Filter by status"
        - name: environment
          in: query
          required: false
          type: string
          description: "Filter by environment"
        - name: sort_by
          in: query
          required: false
          type: string
          description: "Sort by fields. Example: sort_by=cluster_name,type,status,id,started,finished\n
          Supported values:\n
           - id\n
           - cluster_name\n
           - type\n
           - status\n
           - started\n
           - finished\n
           - cluster\n
           - environment\n"
